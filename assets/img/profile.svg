<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-label="A database server rack character wearing a cowboy hat and chewing a straw">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1b38"/><stop offset=".45" stop-color="#8e3f3a"/><stop offset=".72" stop-color="#e58f4a"/><stop offset="1" stop-color="#f6c76a"/></linearGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4a4f5c"/><stop offset=".5" stop-color="#5b6170"/><stop offset="1" stop-color="#3a3e49"/></linearGradient>
</defs>
<rect width="600" height="800" fill="url(#sky)"/>
<g fill="#f6e3b0"><circle cx="70" cy="60" r="2" opacity=".8"/><circle cx="140" cy="120" r="1.5" opacity=".6"/><circle cx="510" cy="70" r="2" opacity=".8"/><circle cx="460" cy="150" r="1.5" opacity=".6"/><circle cx="550" cy="230" r="2" opacity=".5"/><circle cx="40" cy="250" r="1.5" opacity=".5"/><circle cx="380" cy="40" r="1.5" opacity=".6"/></g>
<circle cx="300" cy="500" r="150" fill="#f8d67c"/>
<path d="M0 560 L70 500 L130 500 L170 540 L230 520 L290 560 L380 505 L450 505 L500 545 L600 510 L600 800 L0 800Z" fill="#6e2f2b"/>
<path d="M0 640 L90 610 L170 632 L260 614 L350 636 L460 610 L600 640 L600 800 L0 800Z" fill="#3d2013"/>
<g fill="#18241a"><rect x="40" y="540" width="26" height="190" rx="13"/><rect x="8" y="600" width="14" height="60" rx="7"/><rect x="8" y="640" width="44" height="14" rx="7"/><rect x="84" y="580" width="14" height="50" rx="7"/><rect x="62" y="616" width="36" height="14" rx="7"/></g>
<g fill="#18241a"><rect x="530" y="610" width="20" height="130" rx="10"/><rect x="558" y="640" width="12" height="40" rx="6"/><rect x="538" y="672" width="32" height="12" rx="6"/></g>

<ellipse cx="300" cy="712" rx="150" ry="16" fill="#000" opacity=".35"/>

<!-- cable arms -->
<path d="M190 440 C140 450 120 500 140 545" fill="none" stroke="#1d2027" stroke-width="12" stroke-linecap="round"/>
<rect x="128" y="540" width="24" height="22" rx="4" fill="#d9b45a"/>
<path d="M410 470 C462 480 482 520 462 545" fill="none" stroke="#1d2027" stroke-width="12" stroke-linecap="round"/>
<rect x="448" y="540" width="24" height="22" rx="4" fill="#d9b45a"/>

<!-- boots -->
<g fill="#4a2c18" stroke="#24150a" stroke-width="3"><path d="M212 668 h56 v26 h28 v18 h-84z"/><path d="M332 668 h56 v26 h28 v18 h-84z" transform="translate(-0 0)"/></g>

<!-- rack body -->
<rect x="185" y="318" width="230" height="352" rx="12" fill="url(#steel)" stroke="#1d2027" stroke-width="6"/>
<g fill="#2b2f39"><rect x="199" y="332" width="202" height="76" rx="6"/><rect x="199" y="420" width="202" height="62" rx="6"/><rect x="199" y="494" width="202" height="62" rx="6"/><rect x="199" y="568" width="202" height="86" rx="6"/></g>

<!-- face: eyes -->
<circle cx="250" cy="362" r="18" fill="#f6efd8"/><circle cx="350" cy="362" r="18" fill="#f6efd8"/>
<circle cx="256" cy="364" r="8" fill="#18120d"/><circle cx="356" cy="364" r="8" fill="#18120d"/>
<path d="M228 340 L270 350 M372 340 L330 350" stroke="#f6efd8" stroke-width="6" stroke-linecap="round"/>
<!-- face: smirk -->
<path d="M252 385 Q300 404 348 380" fill="none" stroke="#f6efd8" stroke-width="6" stroke-linecap="round"/>

<!-- straw chewed in the mouth -->
<path d="M346 382 L452 366" stroke="#d9b45a" stroke-width="6" stroke-linecap="round"/>
<path d="M452 366 l24 -12 m-24 12 l28 2 m-28 -2 l20 14" stroke="#d9b45a" stroke-width="4" stroke-linecap="round"/>

<!-- slot 2: vents + sheriff star -->
<polygon points="226,436 232,450 247,450 235,459 240,474 226,465 212,474 217,459 205,450 220,450" fill="#e8c06a" stroke="#6b4a1f" stroke-width="2" stroke-linejoin="round"/>
<g stroke="#4a4f5c" stroke-width="4" stroke-linecap="round"><path d="M270 436 H386 M270 452 H386 M270 468 H386"/></g>

<!-- slot 3: drive bays + LEDs -->
<g fill="#4a4f5c"><rect x="212" y="506" width="60" height="38" rx="4"/><rect x="280" y="506" width="60" height="38" rx="4"/></g>
<circle cx="366" cy="518" r="6" fill="#6fe07b"/><circle cx="386" cy="518" r="6" fill="#f2b84b"/><circle cx="366" cy="536" r="6" fill="#6fe07b"/><circle cx="386" cy="536" r="6" fill="#6fe07b"/>

<!-- slot 4: database cylinder badge -->
<g transform="translate(300 611)">
  <path d="M-34 -26 v44 c0 10 15 16 34 16 s34 -6 34 -16 v-44" fill="#2f6f8f" stroke="#a9d6ea" stroke-width="3"/>
  <ellipse cx="0" cy="-26" rx="34" ry="12" fill="#4c97bd" stroke="#a9d6ea" stroke-width="3"/>
  <path d="M-34 -4 c0 10 15 16 34 16 s34 -6 34 -16 M-34 14 c0 10 15 16 34 16 s34 -6 34 -16" fill="none" stroke="#a9d6ea" stroke-width="3"/>
</g>

<!-- cowboy hat -->
<ellipse cx="300" cy="316" rx="158" ry="24" fill="#5a3a1f" stroke="#2a1b12" stroke-width="4"/>
<path d="M222 316 C220 252 244 214 300 214 C356 214 380 252 378 316 Z" fill="#7b5530" stroke="#2a1b12" stroke-width="4" stroke-linejoin="round"/>
<path d="M240 232 Q300 250 360 232" fill="none" stroke="#2a1b12" stroke-width="3" opacity=".5"/>
<rect x="222" y="284" width="156" height="20" fill="#2a1b12"/>
<rect x="288" y="281" width="24" height="26" rx="3" fill="#e8c06a" stroke="#6b4a1f" stroke-width="2"/>
<rect x="294" y="288" width="12" height="12" rx="2" fill="#2a1b12"/>
</svg>
